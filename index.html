 class="card"><h3>Help Center</h3>${helpPanel()}</div><div class="card"><h3>Privacy &amp; Data</h3><p class="note">Records are stored in this browser's local storage and are not automatically sent to DoseClick or other services. Exporting or opening a donation link uses the destination you choose. Browser data deletion can erase records. Local storage is not encrypted by DoseClick.</p>${!state.lastBackupAt||Date.now()-Date.parse(state.lastBackupAt)>14*86400000?'<p class="backup-warning">Backup check: No recent backup recorded on this device.</p>':`<p class="note">Last backup requested: ${esc(patchDate(state.lastBackupAt))}. Verify the file was saved.</p>`}<button class="outline wide" data-backup>Download Full JSON Backup</button><button class="outline wide" data-import>Import JSON Backup</button><input type="file" id="importFile" accept="application/json,.json" class="hide"><button class="outline danger wide" data-delete>Delete All Local Data</button></div>`}

function render(){document.body.dataset.theme=state.theme||'classic';document.body.classList.toggle('privacy-mode',!!state.privacyMode);todayKey=day(new Date());if(!visible().some(s=>s.id===state.active))state.active=visible()[0]?.id||null;nav();$('screen').innerHTML=state.tab==='track'?track():state.tab==='trends'?trends():state.tab==='send'?send():state.tab==='support'?support():custom();bind()}
function logDose(timestamp){if(Date.now()-lastLogAt<900)return;const s=current();if(!s)return;const amount=Number(state.pending[s.id]||0);if(!validAmount(amount)||!Number.isFinite(Date.parse(timestamp))||Date.parse(timestamp)>Date.now()+60000){notice('Invalid amount or timestamp');return}lastLogAt=Date.now();const r={id:uid(),time:timestamp,slotId:s.id,name:s.name,unit:s.unit,amount,type:s.type,mode:s.type==='rapid'?state.mode:s.type==='basal'?'mdi':''};if(!validateRecord(r)){notice('Invalid entry');return}state.records.unshift(r);adjustSupply(r,-amount);state.pending[s.id]=0;earlierOpen=false;undoLog={id:r.id};save();render();if(state.haptics&&navigator.vibrate)navigator.vibrate(35);toast(`✓ ${fmt(amount)} ${s.unit} ${s.name} logged`,true)}

// SETTINGS compatibility controller: delegated events survive screen re-renders and
// are registered before the per-screen binding routine. Existing data keys unchanged.
function settingsCommit(el){
 if(state.tab!=='custom')return false;
 const field=el.closest('[data-field]');
 if(field){
  const [idx,key]=field.dataset.field.split(':'),slot=state.slots[Number(idx)];
  if(!slot)return true;
  if(key==='step'){
   const n=Number(field.value);
   if(!Number.isFinite(n)||n<=0||n>1000000||Math.round(n*1000)/1000!==n){alert('Enter a positive increment with up to three decimal places');return true}
   slot.step=n;state.pending[slot.id]=0;
  }else{
   const value=field.value.trim();if(!value){alert('Name and unit cannot be blank');return true}
   slot[key]=value;
  }
  save();render();notice('Preference saved');return true;
 }
 const category=el.closest('[data-category]');
 if(category){const slot=state.slots[Number(category.dataset.category)],c=CATEGORIES[category.value];if(!slot||!c)return true;
 slot.category=category.value;slot.type=['rapid','basal'].includes(category.value)?category.value:'custom';
 if(!slot.name||Object.values(CATEGORIES).some(v=>v.name===slot.name))slot.name=c.name;
 slot.symbol=c.symbol;slot.unit=c.unit;save();render();return true}
 if(el.id==='mode'){state.mode=el.value;save();render();return true}
 if(el.id==='rapidCap'||el.id==='basalCap'){const n=Number(el.value);if(!Number.isFinite(n)||n<=0||n>100000){alert('Enter a valid capacity');return true}state[el.id==='rapidCap'?'rapidCapacity':'basalCapacity']=n;save();render();return true}
 if(el.id==='haptics'){state.haptics=el.checked;save();return true}
 return false;
}
document.addEventListener('change',e=>{if(settingsCommit(e.target)){e.stopImmediatePropagation()}},true);
document.addEventListener('click',e=>{
 if(state.tab!=='custom')return;
 const b=e.target.closest('button');if(!b)return;
 if(b.hasAttribute('data-add-tracker')){
  e.stopImmediatePropagation();const category=document.getElementById('newCategory')?.value;
  if(!CATEGORIES[category]){notice('Choose a category first');return}
  if(state.slots.length>=6)return;
  const slot=createSlot(category);state.slots.push(slot);state.active=slot.id;state.onboarded=true;save();render();notice('Tracker added');return;
 }
 if(b.hasAttribute('data-remove-tracker')){
  e.stopImmediatePropagation();const i=Number(b.dataset.removeTracker);if(!state.slots[i])return;
  if(!confirm('Remove this tracker from the home screen? Its history will remain.'))return;
  const [removed]=state.slots.splice(i,1);delete state.pending[removed.id];save();render();return;
 }
 if(b.hasAttribute('data-move')){
  e.stopImmediatePropagation();const [i,d]=b.dataset.move.split(':').map(Number),j=i+d;
  if(j<0||j>=state.slots.length)return;
  [state.slots[i],state.slots[j]]=[state.slots[j],state.slots[i]];save();render();return;
 }
},true);

document.querySelector('[data-restore-entry]')?.addEventListener('click',()=>{if(!deletedUndo)return;const {record,index}=deletedUndo;state.records.splice(Math.min(index,state.records.length),0,record);adjustSupply(record,-Number(record.amount));state.recentlyDeleted=state.recentlyDeleted.filter(x=>x.record.id!==record.id);deletedUndo=null;save();render();notice('Entry restored')});
document.querySelector('[data-showall]')?.addEventListener('click',()=>{state.showAll=!state.showAll;render()});document.querySelectorAll('[data-period]').forEach(b=>b.onclick=()=>{state.period=b.dataset.period;save();render()});document.querySelectorAll('[data-calendar-day]').forEach(b=>b.onclick=()=>{state.selectedDate=b.dataset.calendarDay;save();render()});document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{const [y,m]=calendarMonth.split('-').map(Number),d=new Date(y,m-1+Number(b.dataset.month),1);calendarMonth=day(d).slice(0,7);render()});document.querySelectorAll('[data-share-period]').forEach(b=>b.onclick=()=>{state.shareDays=b.dataset.sharePeriod;save();render()});document.querySelectorAll('[data-share-id]').forEach(b=>b.onchange=()=>{state.shareIds=b.checked?[...new Set([...state.shareIds,b.dataset.shareId])]:state.shareIds.filter(x=>x!==b.dataset.shareId);save();render()});document.querySelector('[data-share-all]')?.addEventListener('click',()=>{state.shareIds=[];save();render()});document.querySelector('[data-preview]')?.addEventListener('click',()=>{sharePreview=!sharePreview;render()});document.querySelector('[data-ideas]')?.addEventListener('click',()=>{ideasOpen=!ideasOpen;render()});document.querySelector('[data-close-ideas]')?.addEventListener('click',()=>{ideasOpen=false;render()});document.querySelector('[data-save-preset]')?.addEventListener('click',()=>{const name=prompt('Name this export preset (up to 40 characters):');if(!name?.trim())return;state.exportPresets.push({label:name.trim().slice(0,40),days:state.shareDays,ids:[...state.shareIds]});save();render()});document.querySelectorAll('[data-use-preset]').forEach(b=>b.onclick=()=>{const p=state.exportPresets[Number(b.dataset.usePreset)];if(!p)return;state.shareDays=p.days;state.shareIds=[...p.ids];save();render()});document.querySelectorAll('[data-remove-preset]').forEach(b=>b.onclick=()=>{state.exportPresets.splice(Number(b.dataset.removePreset),1);save();render()});document.querySelector('[data-copy]')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(summarize(scopedRecords(),true));notice('Summary copied')}catch{notice('Clipboard unavailable; use CSV export')}});document.querySelector('[data-pdf]')?.addEventListener('click',()=>printableReport(scopedRecords()));document.querySelector('[data-csv]')?.addEventListener('click',()=>download('doseclick-entries.csv',csv(),'text/csv;charset=utf-8'));document.querySelectorAll('[data-category]').forEach(el=>el.onchange=()=>{const i=Number(el.dataset.category),s=state.slots[i],c=CATEGORIES[el.value];if(!s||!c)return;s.category=el.value;s.type=['rapid','basal'].includes(el.value)?el.value:'custom';if(!s.name||Object.values(CATEGORIES).some(v=>v.name===s.name))s.name=c.name;s.symbol=c.symbol;s.unit=c.unit;save();render()});document.querySelectorAll('[data-field]').forEach(el=>el.onchange=()=>{const [i,f]=el.dataset.field.split(':'),s=state.slots[Number(i)];if(!s)return;if(f==='step'){const n=Number(el.value);if(!Number.isFinite(n)||n<=0||n>1000000||Math.round(n*1000)/1000!==n){alert('Enter a positive increment with up to three decimal places');render();return}s.step=n;state.pending[s.id]=0}else{const v=el.value.trim();if(!v){alert('Name and unit cannot be blank');render();return}s[f]=v}save();render();notice('Preference saved')});document.querySelector('[data-add-tracker]')?.addEventListener('click',()=>{const category=$('newCategory')?.value;if(!CATEGORIES[category]){notice('Choose a category first');return}if(state.slots.length>=6)return;const s=createSlot(category);state.slots.push(s);state.active=s.id;state.onboarded=true;save();state.tab='custom';render();notice('Tracker added. Customize its name and amount.')});document.querySelectorAll('[data-remove-tracker]').forEach(b=>b.onclick=()=>{const i=Number(b.dataset.removeTracker);if(!confirm('Remove this tracker from the home screen? Its logged history will be preserved.'))return;const [removed]=state.slots.splice(i,1);delete state.pending[removed.id];save();render()});document.querySelector('[data-finish-setup]')?.addEventListener('click',()=>{state.onboarded=true;save();render()});document.querySelector('[data-go-settings]')?.addEventListener('click',()=>{state.tab='custom';render()});document.querySelector('[data-go-share]')?.addEventListener('click',()=>{state.tab='send';render()});$('language')?.addEventListener('change',e=>{if(e.target.value==='es'){notice('Spanish translation is planned; English remains active');e.target.value='en';return}state.language='en';save()});$('mode')?.addEventListener('change',e=>{state.mode=e.target.value;save();render()});for(const [id,k] of [['rapidCap','rapidCapacity'],['basalCap','basalCapacity']])$(id)?.addEventListener('change',e=>{const n=Number(e.target.value);if(n<=0||n>100000){alert('Enter a valid capacity');render();return}state[k]=n;save();render()});document.querySelector('[data-edit-patch-start]')?.addEventListener('click',()=>{patchStartEditing=!patchStartEditing;render()});document.querySelector('[data-cancel-patch-start]')?.addEventListener('click',()=>{patchStartEditing=false;render()});document.querySelector('[data-save-patch-start]')?.addEventListener('click',()=>{const raw=$('patchStartInput')?.value;if(!raw){notice('Select a patch start date and time');return}const dt=new Date(raw);if(!Number.isFinite(dt.getTime())||dt.getTime()>Date.now()){notice('Enter a valid patch start time that is not in the future');return}state.patchStartedAt=dt.toISOString();patchStartEditing=false;save();render();notice('Patch start time updated; days of use recalculated')});document.querySelectorAll('[data-new]').forEach(el=>el.onclick=()=>{const t=el.dataset.new;if(t==='rapid'&&state.mode==='patch'){if(!confirm('Start a new patch?\n\nThis records the current date and time, resets the rapid patch supply estimate to its configured capacity, and restarts Days of Use at 0. Previous dose records and patch start history will remain.'))return;const now=new Date().toISOString();if(state.patchStartedAt){state.patchHistory=Array.isArray(state.patchHistory)?state.patchHistory:[];state.patchHistory.push(state.patchStartedAt)}state.patchStartedAt=now}else{if(!confirm('Reset estimated '+t+' supply to full capacity? Previous records will remain.'))return}state.remaining[t]=state[t+'Capacity'];save();render();notice(t==='rapid'&&state.mode==='patch'?'New patch started and timestamp saved':'Supply counter reset')});document.querySelector('[data-backup]')?.addEventListener('click',()=>{const copy={...state,lastBackupAt:new Date().toISOString()};download('doseclick-backup-'+day(new Date())+'.json',JSON.stringify(copy,null,2),'application/json');state.lastBackupAt=copy.lastBackupAt;save();render();notice('Backup download requested; verify it was saved')});document.querySelector('[data-import]')?.addEventListener('click',()=>$('importFile').click());$('importFile')?.addEventListener('change',async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.slots)||obj.slots.length>6||!Array.isArray(obj.records)||!obj.records.every(validateRecord))throw Error('Invalid backup');if(!confirm('Replace all local records and settings with imported backup?'))return;state={...defaults(),...obj,pending:{},tab:'track',onboarded:true};state.recentlyDeleted=Array.isArray(state.recentlyDeleted)?state.recentlyDeleted.filter(x=>x&&validateRecord(x.record)):[];state.theme=['classic','ocean','midnight'].includes(state.theme)?state.theme:'classic';if(!state.remaining||!Number.isFinite(Number(state.remaining.rapid))||!Number.isFinite(Number(state.remaining.basal)))throw Error('Invalid supply values');save();render();notice('Backup imported')}catch(err){alert('Import failed: '+err.message)}});document.querySelector('[data-delete]')?.addEventListener('click',()=>{if(prompt('Type DELETE to permanently erase all local DoseClick data')!=='DELETE')return;state=defaults();save();render();notice('Local data cleared')})}
// Returning to the installed app from the background should also show Track.
document.addEventListener('visibilitychange',()=>{if(!document.hidden){if(Date.now()-lastInteraction>5*60000){state.pending={};earlierOpen=false}lastInteraction=Date.now();updateDay();if(state.tab!=='track'){state.tab='track';save();render()}else{save();render()}}else{lastInteraction=Date.now()}});
window.addEventListener('focus',updateDay);
setInterval(()=>{if(!document.hidden)updateDay()},60000);
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>notice('Offline setup unavailable; tracking still works while online.'));

window.addEventListener('pageshow',e=>{if(e.persisted&&state.tab!=='track'){state.tab='track';save();render()}});
render();save();
})();
